<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Card 1 (Sunny Gold Card) -->
    <linearGradient id="goldCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <!-- Primary Speech Card (Vibrant Royal Sky) -->
    <linearGradient id="blueCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Voice Sound Waves Gradient -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
    
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#B45309" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 1. Background Sunny Gold Communication Card (Tilted slightly right) -->
  <g transform="rotate(10 65 46)" filter="url(#goldShadow)">
    <rect x="34" y="16" width="50" height="56" rx="12" fill="url(#goldCardGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Cute miniature heart/sparkle on back card -->
    <circle cx="59" cy="38" r="10" fill="#FFFFFF" opacity="0.3"/>
    <path d="M 59,33 C 56,28 49,30 49,36 C 49,42 59,47 59,47 C 59,47 69,42 69,36 C 69,30 62,28 59,33 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- 2. Main Front Speech/Communication Bubble (Tilted slightly left) -->
  <g transform="rotate(-4 42 54)" filter="url(#softShadow)">
    <!-- Speech Bubble Shape with Soft Tail -->
    <path d="M 22,20 
             L 66,20 
             A 14,14 0 0,1 80,34 
             L 80,62 
             A 14,14 0 0,1 66,76 
             L 38,76 
             L 24,87 
             L 26,76 
             L 22,76 
             A 14,14 0 0,1 8,62 
             L 8,34 
             A 14,14 0 0,1 22,20 Z" 
          fill="url(#blueCardGrad)" 
          stroke="#FFFFFF" 
          stroke-width="3"/>

    <!-- Cute Smiling Happy Face -->
    <!-- Left Eye -->
    <circle cx="34" cy="45" r="4.2" fill="#FFFFFF"/>
    <circle cx="35.5" cy="43.5" r="1.6" fill="#1E3A8A"/>
    <!-- Right Eye -->
    <circle cx="54" cy="45" r="4.2" fill="#FFFFFF"/>
    <circle cx="55.5" cy="43.5" r="1.6" fill="#1E3A8A"/>

    <!-- Sweet Smiling Mouth -->
    <path d="M 38,54 Q 44,61 50,54" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Cute Rosy Blush Cheeks -->
    <ellipse cx="27" cy="52" rx="4" ry="2.5" fill="#F43F5E" opacity="0.6"/>
    <ellipse cx="61" cy="52" rx="4" ry="2.5" fill="#F43F5E" opacity="0.6"/>
  </g>

  <!-- 3. Dynamic Happy Speech / Sound Waves (My Voice!) -->
  <g transform="translate(68, 14)">
    <!-- Small Wave -->
    <path d="M 4,14 A 12,12 0 0,1 4,32" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Large Wave -->
    <path d="M 11,8 A 20,20 0 0,1 11,38" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Star Sparkle -->
    <path d="M 16,4 L 18,9 L 23,11 L 18,13 L 16,18 L 14,13 L 9,11 L 14,9 Z" fill="#FBBF24"/>
  </g>
</svg>
